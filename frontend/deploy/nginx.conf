# Static frontend only. /app deep links must use the dashboard entry.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index app/index.html;

    location = / { return 302 /app/$is_args$args; }

    location = /app { return 308 /app/$is_args$args; }
    location /app/ { try_files $uri $uri/ /app/index.html; }

    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
