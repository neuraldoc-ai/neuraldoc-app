name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please do not include keys, customer data or private code. Security issues go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected and what you got.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Showcase, Own project]
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How do you run neuraldoc?
      options: [Docker, npm run dev, npm run start]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Container log (`docker logs <container>`), browser console or import warnings.
      render: text
