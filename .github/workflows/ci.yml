name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: docker build -t neuraldoc .
      - name: Smoke test
        run: |
          docker run -d --name neuraldoc -p 8080:8080 neuraldoc
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/live && break; sleep 1; done
          curl -fs http://localhost:8080/app/ > /dev/null
          curl -fs http://localhost:8080/api/mcp/project
