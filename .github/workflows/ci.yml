name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      # The app image must build without the MOBIQ submodules.
      - uses: actions/checkout@v7
      - run: docker build -t neuraldoc .
      - name: Smoke test
        run: |
          docker run -d --name neuraldoc -p 8080:8080 neuraldoc
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/live && break; sleep 1; done
          curl -fs http://localhost:8080/app/ > /dev/null
          curl -fs http://localhost:8080/api/mcp/project | grep -q '"mode":"empty"'
          ! docker exec neuraldoc grep -rqi musterhaus /app/frontend/dist/assets

  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: docker build --target showcase -t neuraldoc-showcase .
      - name: Smoke test
        run: |
          docker run -d --name showcase -p 8080:8080 neuraldoc-showcase
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health/live && break; sleep 1; done
          curl -fs http://localhost:8080/api/mcp/project | grep -q '"mode":"showcase"'
